<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>결혼합니다</title>

  <!-- ⚠️ OG 태그는 크롤러가 JS를 실행하지 않으므로 직접 수정해주세요 -->
  <meta property="og:title" content="승현 ♥ 하영 결혼합니다">
  <meta property="og:description" content="2026년 9월 12일 토요일 오후 4시 50분">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Serif+KR:wght@200;400;600&display=swap" rel="stylesheet">

  <!-- Kakao Map SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f8753407c6bab9d3c5a1d9e70c9d3946&autoload=false"></script>

  <link rel="stylesheet" href="css/reset.css?v=1.0">
  <link rel="stylesheet" href="css/common.css?v=1.0">
  <link rel="stylesheet" href="css/hero.css?v=1.0">
  <link rel="stylesheet" href="css/greeting.css?v=1.0">
  <link rel="stylesheet" href="css/info.css?v=1.0">
  <link rel="stylesheet" href="css/location.css?v=1.0">
  <link rel="stylesheet" href="css/contact.css?v=1.0">
  <link rel="stylesheet" href="css/account.css?v=1.0">
  <link rel="stylesheet" href="css/gallery.css?v=1.0">
  <link rel="stylesheet" href="css/dday.css?v=1.0">
  <link rel="stylesheet" href="css/animation.css?v=1.0">
  <link rel="stylesheet" href="css/music.css?v=1.0">
  <link rel="stylesheet" href="css/confetti.css?v=1.0">
</head>
<body>
  <!-- 1. 메인 비주얼 — render.js 에서 동적 렌더링 -->
  <section id="hero" class="section hero"></section>

  <!-- 2. 인사말 — 텍스트·부모 소개는 render.js 에서 동적 렌더링 -->
  <section id="greeting" class="section greeting">
    <div class="greeting__divider fade-up"><span>✦</span></div>
    <h2 class="section__title fade-up">초대합니다</h2>
    <p class="greeting__text fade-up" id="greeting-text"></p>
    <hr class="divider--short fade-up">
    <div class="greeting__parents fade-up" id="greeting-parents"></div>
  </section>

  <!-- 3. 갤러리 -->
  <section id="gallery" class="section gallery">
    <h2 class="section__title fade-up">갤러리</h2>
    <div class="gallery__grid stagger">
      <!-- ⚠️ assets/gallery/ 폴더에 사진을 넣고 경로를 수정하세요 -->
      <div class="gallery__item fade-up"><img src="assets/gallery/01.jpg" alt="웨딩 사진 1"></div>
      <div class="gallery__item fade-up"><img src="assets/gallery/02.jpg" alt="웨딩 사진 2"></div>
      <div class="gallery__item fade-up"><img src="assets/gallery/03.jpg" alt="웨딩 사진 3"></div>
      <div class="gallery__item fade-up"><img src="assets/gallery/04.jpg" alt="웨딩 사진 4"></div>
      <div class="gallery__item fade-up"><img src="assets/gallery/05.jpg" alt="웨딩 사진 5"></div>
      <div class="gallery__item fade-up"><img src="assets/gallery/06.jpg" alt="웨딩 사진 6"></div>
    </div>
  </section>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" aria-label="닫기">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="이전">&#8249;</button>
    <img class="lightbox__img" src="" alt="갤러리 사진">
    <button class="lightbox__nav lightbox__nav--next" aria-label="다음">&#8250;</button>
    <span class="lightbox__counter"></span>
  </div>

  <div class="section-divider">
    <span></span><span></span><span></span>
  </div>

  <!-- 4. 예식 정보 -->
  <section id="info" class="section info">
    <h2 class="section__title fade-up">예식 안내</h2>
    <div class="info__calendar fade-up" id="calendar"></div>
    <div class="info__dday fade-up">
      <div class="dday__counter dday__counter--small">
        <div class="dday__unit">
          <span class="dday__number" id="dday-days">0</span>
          <span class="dday__label">DAYS</span>
        </div>
        <span class="dday__separator">:</span>
        <div class="dday__unit">
          <span class="dday__number" id="dday-hours">0</span>
          <span class="dday__label">HOURS</span>
        </div>
        <span class="dday__separator">:</span>
        <div class="dday__unit">
          <span class="dday__number" id="dday-mins">0</span>
          <span class="dday__label">MINS</span>
        </div>
        <span class="dday__separator">:</span>
        <div class="dday__unit">
          <span class="dday__number" id="dday-secs">0</span>
          <span class="dday__label">SECS</span>
        </div>
      </div>
      <p class="dday__message" id="dday-message"></p>
    </div>
    <a class="btn btn--outline info__calendar-save fade-up" href="assets/wedding.ics" download="wedding.ics">
      🗓 캘린더에 저장
    </a>
  </section>

  <!-- 오시는 길 -->
  <section id="location" class="section location">
    <h2 class="section__title fade-up">오시는 길</h2>
    <div class="location__map-wrap fade-up">
      <div id="map" style="width:100%;height:250px;"></div>
      <button class="location__map-toggle" id="mapToggle" aria-label="지도 조작 켜기/끄기">
        <svg class="map-toggle__icon map-toggle__icon--lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <svg class="map-toggle__icon map-toggle__icon--unlock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden>
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
        </svg>

      </button>
    </div>
    <!-- 주소는 render.js 에서 동적 렌더링 -->
    <div class="location__address fade-up" id="location-address"></div>
    <p class="location__nav-title fade-up">길안내 앱으로 바로가기</p>
    <div class="location__links fade-up">
      <a href="#" class="location__link-btn" id="naverMapLink">
        <span class="location__link-icon">
          <img src="assets/map/navermap.png" alt="네이버 지도" width="24" height="24" style="border-radius:6px;">
        </span>
        <span class="location__link-label">네이버 지도</span>
      </a>
      <a href="#" class="location__link-btn" id="kakaoMapLink">
        <span class="location__link-icon">
          <img src="assets/map/kakaomap_basic.png" alt="카카오맵" width="24" height="24" style="border-radius:6px;">
        </span>
        <span class="location__link-label">카카오맵</span>
      </a>
      <a href="#" class="location__link-btn" id="tmapLink">
        <span class="location__link-icon">
          <img src="assets/map/tmap.png" alt="티맵" width="24" height="24" style="border-radius:6px;">
        </span>
        <span class="location__link-label">티맵</span>
      </a>
    </div>
  </section>

  <!-- 5. 연락처 — contact.js 에서 동적 렌더링 -->
  <section id="contact" class="section contact">
    <h2 class="section__title fade-up">연락하기</h2>
  </section>

  <!-- 6. 축의금 계좌 안내 — render.js 에서 동적 렌더링 -->
  <section id="account" class="section account">
    <h2 class="section__title fade-up">마음 전하실 곳</h2>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>Thank you</p>
  </footer>

  <!-- 배경음악 -->
  <audio id="bg-music" loop>
    <source src="assets/music/bgm.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" id="music-btn" aria-label="음악 재생/일시정지">
    <span class="music-btn__icon music-btn__icon--play">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    </span>
    <span class="music-btn__icon music-btn__icon--pause" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </span>
    <span class="music-btn__note">♪</span>
  </button>

  <script src="js/config.js?v=1.0"></script>
  <script src="js/render.js?v=1.0"></script>
  <script src="js/map.js?v=1.0"></script>
  <script src="js/calendar.js?v=1.0"></script>
  <script src="js/contact.js?v=1.0"></script>
  <script src="js/gallery.js?v=1.0"></script>
  <script src="js/dday.js?v=1.0"></script>
  <script src="js/animation.js?v=1.0"></script>
  <script src="js/overlay.js?v=1.0"></script>
  <script src="js/confetti.js?v=1.0"></script>
  <script src="js/music.js?v=1.0"></script>
  <script src="js/main.js?v=1.0"></script>
</body>
</html>
